<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avem guvern? — Romania</title>
    <meta name="description" content="Are Romania un guvern (ne-interimar)? Raspunsul, pe scurt." />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avem guvern?" />
    <meta property="og:description" content="Are Romania un guvern? Raspunsul, pe scurt." />
    <meta property="og:url" content="https://avemguvern.ro" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />

    <style>
      :root {
        --bg: #0a0a0f;
        --fg: #f5f5f7;
        --muted: #8a8a99;
        --ro-blue: #002b7f;
        --ro-yellow: #fcd116;
        --ro-red: #ce1126;
        --accent: var(--ro-yellow);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
      }
      main { padding-bottom: 96px; }
      /* Romanian flag accent bar */
      .flag {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(
          to right,
          var(--ro-blue) 0 33.33%,
          var(--ro-yellow) 33.33% 66.66%,
          var(--ro-red) 66.66% 100%
        );
      }
      main { max-width: 720px; }
      .question {
        font-size: clamp(0.9rem, 3vw, 1.2rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.6em;
      }
      .answer {
        font-size: clamp(5rem, 26vw, 14rem);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--ro-yellow), var(--ro-red));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 0.15em;
      }
      .subtitle {
        font-size: clamp(1.1rem, 4vw, 1.9rem);
        font-weight: 500;
        color: var(--fg);
        opacity: 0.92;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 18px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 20px;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
      footer a:hover { color: var(--fg); }
      @media (max-width: 520px) {
        footer { font-size: 0.78rem; gap: 10px 14px; }
        .interact { margin-top: 2.2em; padding: 1.6em 1.1em 1.4em; border-radius: 16px; }
        .pills { gap: 8px; }
        .party { padding: 7px 13px; font-size: 0.9rem; }
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 80px;
        transform: translate(-50%, 16px);
        background: var(--ro-yellow);
        color: #1a1a1a;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 10;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* Command tooltip on the API / MCP links */
      #cmd-tip {
        position: fixed;
        z-index: 20;
        max-width: min(90vw, 540px);
        background: #16161f;
        border: 1px solid #2a2a3d;
        border-radius: 8px;
        padding: 9px 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        color: #e6e6ea;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      #cmd-tip.show { opacity: 1; transform: translateY(0); }
      #cmd-tip .tip-fun {
        display: block;
        margin-top: 7px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.78rem;
        font-style: italic;
        color: var(--ro-yellow);
      }
      #cmd-tip .tip-hint {
        display: block;
        margin-top: 4px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.72rem;
        color: var(--muted);
      }

      /* Interactive opinion flow — set apart from the verdict as a card */
      .interact {
        position: relative;
        margin: 2.8em auto 0;
        width: 100%;
        max-width: 440px;
        padding: 1.9em 1.5em 1.6em;
        /* Flag stripe as a background layer so it's clipped to the rounded corners. */
        background:
          linear-gradient(
            to right,
            var(--ro-blue) 0 33.33%,
            var(--ro-yellow) 33.33% 66.66%,
            var(--ro-red) 66.66% 100%
          ) top center / 100% 3px no-repeat,
          rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1em;
      }
      .prompt {
        font-size: clamp(1.15rem, 4vw, 1.6rem);
        font-weight: 700;
        color: var(--fg);
        opacity: 0.9;
      }
      .choices { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .opt {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        color: var(--fg);
        border: 1.5px solid #33334a;
        border-radius: 999px;
        padding: 10px 20px;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .opt:hover { border-color: var(--ro-yellow); color: var(--ro-yellow); }
      #step-parties {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1em;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 580px;
      }
      /* --c (party color) and --c-fg (readable text on fill) are set per pill in JS. */
      .party {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        position: relative;
        z-index: 1;
        color: #f5f5f7;
        background: color-mix(in srgb, var(--c) 16%, var(--bg));
        border: 1.5px solid color-mix(in srgb, var(--c) 60%, transparent);
        border-radius: 999px;
        padding: 6px 15px 6px 7px;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .party .seats { opacity: 0.6; font-weight: 500; }
      /* Monogram badge — an original logo-style mark, not the party's actual logo. */
      .party .plogo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--c);
        color: var(--c-fg);
        font-size: 0.7rem;
        font-weight: 800;
        flex: none;
      }
      .party[aria-pressed="true"] .plogo {
        background: var(--c-fg);
        color: var(--c);
      }

      /* Leader cutouts that rise from behind the pill on hover / when selected */
      .party-wrap { position: relative; display: inline-flex; }
      .leader-layer {
        position: absolute;
        left: 50%;
        bottom: calc(100% - 14px);
        transform: translateX(-50%);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
        z-index: 0; /* behind its own pill (z-index 1); the wrap's z-index lifts it above higher rows */
      }
      .leader {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 76px;
        height: 88px;
        transform: translateY(75%) scale(0.85);
        opacity: 0;
        transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.2s ease;
        filter: drop-shadow(0 6px 9px rgba(0, 0, 0, 0.5));
      }
      /* Fixed box + cover => every photo renders at the same size regardless of its
         original dimensions; top alignment keeps faces from being cropped. */
      .leader img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center top;
      }
      .leader svg { width: 46px; height: 46px; }
      .leader.front { width: 86px; height: 100px; margin-left: -10px; z-index: 2; }
      .leader-cap {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.6rem;
        font-weight: 600;
        white-space: nowrap;
        color: var(--fg);
        background: rgba(0, 0, 0, 0.55);
        padding: 1px 6px;
        border-radius: 6px;
        display: none;
      }
      .leader.ph .leader-cap { display: block; }
      .leader.gone {
        width: auto;
        height: auto;
        /* lift the short text above its pill; a chip background keeps it readable
           even where it overlaps the pill in the row above */
        margin-bottom: 34px;
        padding: 5px 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: #20202e;
        border-radius: 999px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
        filter: none;
        font-size: 0.82rem;
        font-weight: 800;
        color: var(--fg);
        white-space: nowrap;
      }
      /* Explicit reveal (touch tap, via JS) — works everywhere, one at a time. */
      .party-wrap.revealed .leader:not(.peek) {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      .party-wrap.revealed .leader.front {
        transform: translateY(0) scale(1.05);
        transition-delay: 0.12s;
      }
      /* "peek" cutout: pops up then drops back even while still hovering */
      .leader.peek {
        position: absolute;
        left: 50%;
        bottom: 0;
        z-index: 3;
        transform: translate(calc(-50% - 26px), 80%) scale(0.8);
      }
      /* 500ms after hover: rise slowly (500ms), hold (500ms), slide down + fade (200ms). */
      .party-wrap.revealed .leader.peek {
        animation: peek 1200ms ease-in-out 500ms;
      }
      /* Hover/focus reveal only on true hover devices, so touch never gets a
         stuck :hover/:focus showing cutouts — touch uses the tap path above. */
      @media (hover: hover) {
        .party-wrap:hover .leader:not(.peek),
        .party-wrap:focus-within .leader:not(.peek) {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        .party-wrap:hover .leader.front,
        .party-wrap:focus-within .leader.front {
          transform: translateY(0) scale(1.05);
          transition-delay: 0.12s;
        }
        .party-wrap:hover .leader.peek,
        .party-wrap:focus-within .leader.peek {
          animation: peek 1200ms ease-in-out 500ms;
        }
      }
      @keyframes peek {
        0% { opacity: 0; transform: translate(calc(-50% - 26px), 80%) scale(0.8); }
        41.67% { opacity: 1; transform: translate(calc(-50% - 26px), -8%) scale(1.05); }
        83.33% { opacity: 1; transform: translate(calc(-50% - 26px), -8%) scale(1.05); }
        100% { opacity: 0; transform: translate(calc(-50% - 26px), 80%) scale(0.8); }
      }
      @media (prefers-reduced-motion: reduce) {
        .leader { transition: opacity 0.2s ease; transform: none; }
        .party-wrap:hover .leader:not(.peek),
        .party-wrap:focus-within .leader:not(.peek),
        .party-wrap.revealed .leader:not(.peek) { transform: none; }
        .party-wrap:hover .leader.peek,
        .party-wrap:focus-within .leader.peek,
        .party-wrap.revealed .leader.peek { animation: none; }
      }
      .party:hover {
        background: color-mix(in srgb, var(--c) 30%, var(--bg));
        border-color: var(--c);
      }
      .party[aria-pressed="true"] {
        background: var(--c);
        border-color: var(--c);
        color: var(--c-fg);
      }
      .party[aria-pressed="true"] .seats { opacity: 0.8; }
      .tally { font-size: 0.9rem; color: var(--muted); }
      .tally.majority { color: var(--ro-yellow); font-weight: 600; }
      .combo {
        font-size: 0.86rem;
        font-style: italic;
        line-height: 1.45;
        color: #ffb86b;
        max-width: 360px;
      }
      #step-final { display: flex; flex-direction: column; align-items: center; gap: 1.2em; }
      #propose,
      #propose-final { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .propose-open {
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        text-decoration: underline dotted;
        padding: 0;
      }
      .propose-open:hover { color: var(--fg); }
      .propose-form {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 360px;
      }
      .propose-form input {
        flex: 1 1 200px;
        min-width: 0;
        font: inherit;
        font-size: 0.85rem;
        background: #16161f;
        border: 1px solid #33334a;
        border-radius: 999px;
        color: var(--fg);
        padding: 7px 14px;
      }
      .propose-form input:focus { outline: none; border-color: var(--ro-yellow); }
      .propose-send {
        font: inherit;
        font-weight: 700;
        font-size: 0.85rem;
        background: var(--ro-yellow);
        color: #1a1a1a;
        border: none;
        border-radius: 999px;
        padding: 7px 16px;
        cursor: pointer;
      }
      .opt.anticipate { border-color: var(--ro-red); color: #ff6b7a; }
      .opt.anticipate:hover { background: var(--ro-red); color: #fff; border-color: var(--ro-red); }
      .result { font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 600; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="flag"></div>

    <main>
      <p class="question">Are Romania un guvern?</p>
      <!-- Static fallback (no-JS). Updated live from /api/status. -->
      <h1 class="answer" id="answer">Nu!</h1>
      <p class="subtitle" id="subtitle">Inca e interimar Bolojan!</p>

      <div class="interact" id="interact" hidden>
        <p class="prompt" id="prompt">Si ce parere ai?</p>

        <div class="choices" id="step-opinion">
          <button class="opt" type="button" data-act="meh">Meh, whatever.</button>
          <button class="opt" type="button" data-act="want">Vreau guvern!</button>
        </div>

        <p class="result" id="step-meh" hidden>Sa fii sanatos!</p>

        <div id="step-parties" hidden>
          <div class="pills" id="party-pills"></div>
          <p class="tally" id="tally"></p>
          <p class="combo" id="combo" hidden></p>
          <div id="propose" hidden>
            <button class="propose-open" type="button" id="propose-open">✍️ Gluma mai buna? Zi sa vada toata lumea.</button>
            <form class="propose-form" id="propose-form" hidden>
              <input id="propose-input" type="text" maxlength="160" autocomplete="off"
                     placeholder="Gluma ta pentru combinatia asta..." />
              <button type="submit" class="propose-send">Trimite</button>
            </form>
          </div>
          <button class="opt anticipate" type="button" id="btn-anticipate" hidden>Anticipate?</button>
        </div>

        <div class="choices" id="step-confirm" hidden>
          <button class="opt" type="button" data-act="confirm-yes">Da, sa decida poporul.</button>
          <button class="opt" type="button" data-act="confirm-no">Hai, ca am glumit cu muia aia...</button>
        </div>

        <div id="step-final" hidden>
          <p class="result">👀 Presedintele priveste cu atentie si anticipatie.</p>
          <div id="propose-final">
            <button class="propose-open" type="button" id="propose-final-open">✍️ Gluma mai buna? Zi sa vada toata lumea.</button>
            <form class="propose-form" id="propose-final-form" hidden>
              <input id="propose-final-input" type="text" maxlength="160" autocomplete="off"
                     placeholder="Gluma ta despre alegeri anticipate..." />
              <button type="submit" class="propose-send">Trimite</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <span id="updated"></span>
      <a href="/api/status" id="api-link" aria-label="Copiaza comanda curl pentru API">API</a>
      <a href="/mcp" id="mcp-link" aria-label="Copiaza comanda claude mcp add">MCP</a>
    </footer>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="cmd-tip" role="tooltip"></div>

    <script>
      // Footer links copy a command instead of navigating (with a graceful
      // fallback to the link's href if the clipboard is unavailable).
      const toast = document.getElementById("toast");
      let toastTimer;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }
      const apiCmd = () => "curl -s " + location.origin + "/api/status";
      const mcpCmd = () =>
        "claude mcp add --transport http avemguvern " + location.origin + "/mcp";

      // Tooltip: show the command + a funny line + a "click to copy" hint.
      const tip = document.getElementById("cmd-tip");
      let tipFor = null;
      function showTip(el, cmd, funMsg) {
        tipFor = el;
        tip.textContent = cmd();
        const fun = document.createElement("span");
        fun.className = "tip-fun";
        fun.textContent = funMsg;
        const hint = document.createElement("span");
        hint.className = "tip-hint";
        hint.textContent = "Click pentru a copia";
        tip.append(fun, hint);
        tip.classList.add("show");
        // Center above the link, clamped to the viewport.
        const r = el.getBoundingClientRect();
        const t = tip.getBoundingClientRect();
        let left = r.left + r.width / 2 - t.width / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
        tip.style.left = left + "px";
        tip.style.top = r.top - t.height - 8 + "px";
      }
      function hideTip(el) {
        if (tipFor === el || !el) {
          tip.classList.remove("show");
          tipFor = null;
        }
      }

      function wireLink(linkId, cmd, fallbackPath, funMsg) {
        const el = document.getElementById(linkId);
        el.addEventListener("click", async (e) => {
          // Prevent navigation synchronously, before the async clipboard call.
          e.preventDefault();
          try {
            await navigator.clipboard.writeText(cmd());
            showToast("Comanda a fost copiata! ☕");
            hideTip(el);
          } catch {
            window.location.href = fallbackPath;
          }
        });
        el.addEventListener("mouseenter", () => showTip(el, cmd, funMsg));
        el.addEventListener("mouseleave", () => hideTip(el));
        el.addEventListener("focus", () => showTip(el, cmd, funMsg));
        el.addEventListener("blur", () => hideTip(el));
      }
      wireLink("api-link", apiCmd, "/api/status", "Mai rapid decat formarea unui guvern.");
      wireLink("mcp-link", mcpCmd, "/mcp", "Claude stie, Parlamentul nu.");

      // ---- Interactive opinion flow ----
      // Combined Parliament (Chamber of Deputies + Senate), 2024 election.
      // Total 465 seats; absolute majority = 233.
      // Official party colors (per English Wikipedia's party-color module).
      // Minoritati is a group of minority organizations with no single color.
      // leaders: cutouts that rise from behind the pill (front = comes in front).
      // gone: POT just shows "It's gone!". Minoritati has neither.
      const PARTIES = [
        { id: "PSD", seats: 122, color: "#EF3340", leaders: [{ name: "Grindeanu" }] },
        { id: "AUR", seats: 91, color: "#FCB21F", leaders: [{ name: "Simion" }, { name: "Georgescu", front: true }] },
        { id: "PNL", seats: 71, color: "#FDE000", leaders: [{ name: "Bolojan" }, { name: "Siegfried", front: true }] },
        { id: "USR", seats: 59, color: "#00AAE7", leaders: [{ name: "Fritz" }, { name: "Lasconi", peek: true }] },
        { id: "SOS", seats: 40, color: "#4DA9DA", leaders: [{ name: "Sosoaca" }] },
        { id: "UDMR", seats: 32, color: "#00833E", leaders: [{ name: "Kelemen" }] },
        { id: "POT", seats: 31, color: "#330099", gone: true },
        { id: "Minoritati", seats: 19, color: "#8A8A99" },
      ];
      const MAJORITY = 233;

      // Politically "unnatural" coalitions -> a funny line imagining the government.
      // First matching pair (by order below) wins.
      // Longer (more specific) combos first so they win over the pairs they contain.
      const COMBOS = [
        { pair: ["AUR", "SOS", "POT"], msg: "🎤 AUR + SOS + POT? Guvernul live-urilor. Bugetul se voteaza pe TikTok." },
        { pair: ["AUR", "USR", "UDMR"], msg: "🛗 AUR + USR + UDMR? Simion, Fritz si Kelemen, blocati in acelasi lift." },
        { pair: ["PSD", "AUR", "USR"], msg: "🥊 PSD + AUR + USR? Sedinta de guvern, transmisa pe canalul de box." },
        { pair: ["AUR", "UDMR"], msg: "🤯 AUR + UDMR? Simion si Kelemen, acelasi guvern. Prima motiune: in ce limba ne certam." },
        { pair: ["SOS", "UDMR"], msg: "🍿 SOS + UDMR? Sosoaca si Kelemen, colegi de cabinet. Aduceti popcorn." },
        { pair: ["SOS", "USR"], msg: "📱 SOS + USR? Sosoaca da live, Fritz da statistici. Nu se intalnesc niciodata." },
        { pair: ["AUR", "USR"], msg: "🚲 AUR + USR? Unul vrea granitele din 1918, altul piste de biciclete pana la ele." },
        { pair: ["PSD", "USR"], msg: "🤝 PSD + USR?! Se urasc de ani buni, dar uite-i la aceeasi masa." },
        { pair: ["PNL", "AUR"], msg: "💛 PNL + AUR? Bolojan citeste bugetul, Simion il rupe in direct." },
        { pair: ["PSD", "AUR"], msg: "🎭 PSD + AUR? Stanga nostalgica plus nationalistii. Ce s-ar putea strica?" },
        { pair: ["SOS", "Minoritati"], msg: "🌍 SOS, aliata cu minoritatile? Stam jos si privim." },
        { pair: ["AUR", "Minoritati"], msg: "🌍 AUR cu minoritatile? Plot twist de proportii nationale." },
      ];
      function comboMessage() {
        for (const c of COMBOS) {
          if (c.pair.every((id) => selected.has(id))) return c.msg;
        }
        return null;
      }

      const interact = document.getElementById("interact");
      const prompt = document.getElementById("prompt");
      const stepOpinion = document.getElementById("step-opinion");
      const stepMeh = document.getElementById("step-meh");
      const stepParties = document.getElementById("step-parties");
      const stepConfirm = document.getElementById("step-confirm");
      const stepFinal = document.getElementById("step-final");
      const partyPills = document.getElementById("party-pills");
      const tally = document.getElementById("tally");
      const combo = document.getElementById("combo");
      const propose = document.getElementById("propose");
      const proposeOpen = document.getElementById("propose-open");
      const proposeForm = document.getElementById("propose-form");
      const proposeInput = document.getElementById("propose-input");
      const btnAnticipate = document.getElementById("btn-anticipate");
      const selected = new Set();

      // Pick black or white text for a filled pill, based on color luminance.
      function readableOn(hex) {
        const n = parseInt(hex.slice(1), 16);
        const r = (n >> 16) & 255;
        const g = (n >> 8) & 255;
        const b = n & 255;
        return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "#0a0a0f" : "#ffffff";
      }

      // Touch devices have no hover: tapping a pill reveals that one leader
      // (one at a time), then it auto-hides. Selection still toggles normally.
      const canHover = window.matchMedia("(hover: hover)").matches;
      let revealTimer;
      function revealWrap(wrap) {
        document.querySelectorAll(".party-wrap.revealed").forEach((w) => {
          if (w !== wrap) w.classList.remove("revealed");
        });
        // Reflow so one-shot animations (peek / "It's gone") replay on each tap.
        wrap.classList.remove("revealed");
        void wrap.offsetWidth;
        wrap.classList.add("revealed");
        clearTimeout(revealTimer);
        revealTimer = setTimeout(() => wrap.classList.remove("revealed"), 3500);
      }

      // On touch, no hover means cutouts are invisible until tapped. So while
      // idle on the party step we auto-cycle through them (one at a time) as an
      // attract loop, and stop the moment the user interacts.
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let idleTimer = null;
      function stopIdle() {
        if (idleTimer) {
          clearInterval(idleTimer);
          idleTimer = null;
        }
      }
      function startIdle() {
        stopIdle();
        if (canHover || reduceMotion) return; // hover devices / reduced-motion: skip
        const wraps = [...partyPills.querySelectorAll(".party-wrap")].filter((w) =>
          w.querySelector(".leader-layer"),
        );
        if (!wraps.length) return;
        let i = 0;
        const step = () => revealWrap(wraps[i++ % wraps.length]);
        step();
        idleTimer = setInterval(step, 2600);
      }

      // Generic person silhouette used until a licensed photo is dropped in.
      const PERSON_SVG =
        '<svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)" aria-hidden="true">' +
        '<circle cx="12" cy="8" r="4.2"/>' +
        '<path d="M3.5 21c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/></svg>';

      // A leader cutout. Tries leaders/<name>.png, falls back to a labeled silhouette.
      function leaderEl(leader, color) {
        const el = document.createElement("span");
        el.className =
          "leader" + (leader.front ? " front" : "") + (leader.peek ? " peek" : "");
        el.style.setProperty("--c", color);
        el.title = leader.name;
        const img = document.createElement("img");
        img.alt = leader.name;
        img.src = "leaders/" + leader.name.toLowerCase() + ".png";
        img.addEventListener("error", () => {
          img.remove();
          el.classList.add("ph");
          el.insertAdjacentHTML("afterbegin", PERSON_SVG);
        });
        el.appendChild(img);
        const cap = document.createElement("span");
        cap.className = "leader-cap";
        cap.textContent = leader.name;
        el.appendChild(cap);
        return el;
      }

      // Build party pills once.
      PARTIES.forEach((p, i) => {
        const wrap = document.createElement("span");
        wrap.className = "party-wrap";
        // Increasing z-index top->bottom: a lower pill's cutout rises above the
        // rows above it, while still tucking behind its own pill.
        wrap.style.zIndex = String(i + 1);

        if (p.gone || p.leaders) {
          const layer = document.createElement("span");
          layer.className = "leader-layer";
          if (p.gone) {
            const g = document.createElement("span");
            g.className = "leader gone";
            g.textContent = "It's gone! 💨";
            layer.appendChild(g);
          } else {
            p.leaders.forEach((l) => layer.appendChild(leaderEl(l, p.color)));
          }
          wrap.appendChild(layer);
        }

        const b = document.createElement("button");
        b.type = "button";
        b.className = "party";
        b.setAttribute("aria-pressed", "false");
        b.dataset.party = p.id;
        b.style.setProperty("--c", p.color);
        b.style.setProperty("--c-fg", readableOn(p.color));
        b.innerHTML =
          '<span class="plogo">' +
          p.id[0] +
          "</span>" +
          p.id +
          ' <span class="seats">' +
          p.seats +
          "</span>";
        b.addEventListener("click", () => {
          stopIdle(); // user is interacting now
          if (selected.has(p.id)) selected.delete(p.id);
          else selected.add(p.id);
          b.setAttribute("aria-pressed", selected.has(p.id) ? "true" : "false");
          updateTally();
          if (!canHover) revealWrap(wrap);
        });
        wrap.appendChild(b);
        partyPills.appendChild(wrap);
      });

      function updateTally() {
        const sum = PARTIES.filter((p) => selected.has(p.id)).reduce(
          (n, p) => n + p.seats,
          0
        );
        const hasMajority = sum >= MAJORITY;
        tally.classList.toggle("majority", hasMajority);
        if (selected.size === 0) {
          tally.textContent = "0 / " + MAJORITY + " mandate pentru majoritate";
        } else if (hasMajority) {
          tally.textContent = sum + " / " + MAJORITY + " mandate · Majoritate! ✊";
        } else {
          tally.textContent =
            sum + " / " + MAJORITY + " mandate · mai trebuie " + (MAJORITY - sum);
        }
        // Funny line for an unnatural coalition currently selected.
        const msg = comboMessage();
        if (msg && hasMajority) {
          combo.textContent =
            "🎪 Majoritate cu circul asta?! Felicitari, aveti guvern... pana la prima sedinta.";
          combo.hidden = false;
        } else if (msg) {
          combo.textContent = msg;
          combo.hidden = false;
        } else {
          combo.hidden = true;
        }
        // Let visitors propose their own joke once they've picked a combination.
        propose.hidden = selected.size < 2;
        if (propose.hidden) {
          proposeForm.hidden = true;
          proposeOpen.hidden = false;
        }
        // Early elections only make sense when a coalition can't reach majority.
        btnAnticipate.hidden = !(selected.size > 0 && !hasMajority);
      }

      function show(el) {
        [stepOpinion, stepMeh, stepParties, stepConfirm, stepFinal].forEach(
          (s) => (s.hidden = s !== el)
        );
      }

      interact.addEventListener("click", (e) => {
        const act = e.target.closest("[data-act]")?.dataset.act;
        if (!act) return;
        if (act === "meh") {
          stopIdle();
          prompt.hidden = true;
          show(stepMeh);
        } else if (act === "want") {
          prompt.textContent = "Cu ce sa fie?";
          show(stepParties);
          updateTally();
          startIdle(); // attract loop on touch until first interaction
        } else if (act === "confirm-yes") {
          stopIdle();
          prompt.hidden = true;
          show(stepFinal);
        } else if (act === "confirm-no") {
          prompt.textContent = "Cu ce sa fie?";
          show(stepParties);
          startIdle();
        }
      });

      btnAnticipate.addEventListener("click", () => {
        stopIdle();
        prompt.textContent = "Esti sigur?";
        show(stepConfirm);
      });

      function wirePropose(open, form, input, payloadFn) {
        open.addEventListener("click", () => {
          open.hidden = true;
          form.hidden = false;
          input.focus();
        });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const joke = input.value.trim();
          if (!joke) return;
          try {
            await fetch("/api/joke", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ ...payloadFn(), joke }),
            });
            showToast("Mersi! Gluma ta a fost trimisa. 🙌");
          } catch {
            showToast("Hmm, n-a mers. Mai incearca.");
          }
          input.value = "";
          form.hidden = true;
          open.hidden = false;
        });
      }
      // Combo jokes (uses the currently selected parties).
      wirePropose(proposeOpen, proposeForm, proposeInput, () => ({
        combo: PARTIES.filter((p) => selected.has(p.id)).map((p) => p.id),
      }));
      // Early-elections message joke.
      wirePropose(
        document.getElementById("propose-final-open"),
        document.getElementById("propose-final-form"),
        document.getElementById("propose-final-input"),
        () => ({ topic: "anticipate" }),
      );

      // Reveal the flow only when JS is available.
      interact.hidden = false;

      fetch("/api/status")
        .then((r) => r.json())
        .then((s) => {
          document.getElementById("answer").textContent = s.answer;
          document.getElementById("subtitle").textContent = s.subtitle;
          document.title = "Avem guvern? — " + s.answer;
          if (s.updatedAt) {
            const d = new Date(s.updatedAt);
            if (!isNaN(d)) {
              document.getElementById("updated").textContent =
                "Actualizat: " + d.toLocaleDateString("ro-RO");
            }
          }
        })
        .catch(() => {
          /* keep static fallback */
        });
    </script>
  </body>
</html>
