<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avem guvern? — Romania</title>
    <meta name="description" content="Are Romania un guvern (ne-interimar)? Raspunsul, pe scurt." />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avem guvern?" />
    <meta property="og:description" content="Are Romania un guvern? Raspunsul, pe scurt." />
    <meta property="og:url" content="https://avemguvern.ro" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />

    <style>
      :root {
        --bg: #0a0a0f;
        --fg: #f5f5f7;
        --muted: #8a8a99;
        --ro-blue: #002b7f;
        --ro-yellow: #fcd116;
        --ro-red: #ce1126;
        --accent: var(--ro-yellow);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
      }
      main { padding-bottom: 96px; }
      /* Romanian flag accent bar */
      .flag {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(
          to right,
          var(--ro-blue) 0 33.33%,
          var(--ro-yellow) 33.33% 66.66%,
          var(--ro-red) 66.66% 100%
        );
      }
      main { max-width: 720px; }
      .question {
        font-size: clamp(0.9rem, 3vw, 1.2rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.6em;
      }
      .answer {
        font-size: clamp(5rem, 26vw, 14rem);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--ro-yellow), var(--ro-red));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 0.15em;
      }
      .subtitle {
        font-size: clamp(1.1rem, 4vw, 1.9rem);
        font-weight: 500;
        color: var(--fg);
        opacity: 0.92;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 18px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 20px;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
      footer a:hover { color: var(--fg); }
      .coffee {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--ro-yellow);
        color: #1a1a1a;
        font-weight: 700;
        padding: 9px 16px;
        border-radius: 999px;
        text-decoration: none;
        border: none;
      }
      .coffee:hover { filter: brightness(1.05); }
      @media (max-width: 520px) {
        footer { font-size: 0.78rem; gap: 10px 14px; }
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 80px;
        transform: translate(-50%, 16px);
        background: var(--ro-yellow);
        color: #1a1a1a;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 10;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* Interactive opinion flow */
      .interact {
        margin-top: 2.6em;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1em;
      }
      .prompt {
        font-size: clamp(1rem, 3.5vw, 1.35rem);
        color: var(--fg);
        opacity: 0.85;
      }
      .choices { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .opt {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        color: var(--fg);
        border: 1.5px solid #33334a;
        border-radius: 999px;
        padding: 10px 20px;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .opt:hover { border-color: var(--ro-yellow); color: var(--ro-yellow); }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 580px;
      }
      .party {
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        background: transparent;
        color: var(--muted);
        border: 1.5px solid #33334a;
        border-radius: 999px;
        padding: 8px 15px;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .party .seats { opacity: 0.6; font-weight: 500; }
      .party:hover { color: var(--fg); border-color: #55556e; }
      .party[aria-pressed="true"] {
        background: var(--ro-yellow);
        color: #1a1a1a;
        border-color: var(--ro-yellow);
      }
      .party[aria-pressed="true"] .seats { opacity: 0.75; }
      .tally { font-size: 0.9rem; color: var(--muted); }
      .tally.majority { color: var(--ro-yellow); font-weight: 600; }
      .opt.anticipate { border-color: var(--ro-red); color: #ff6b7a; }
      .opt.anticipate:hover { background: var(--ro-red); color: #fff; border-color: var(--ro-red); }
      .result { font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 600; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="flag"></div>

    <main>
      <p class="question">Are Romania un guvern?</p>
      <!-- Static fallback (no-JS). Updated live from /api/status. -->
      <h1 class="answer" id="answer">Nu!</h1>
      <p class="subtitle" id="subtitle">Inca e interimar Bolojan!</p>

      <div class="interact" id="interact" hidden>
        <p class="prompt" id="prompt">Si ce parere ai?</p>

        <div class="choices" id="step-opinion">
          <button class="opt" type="button" data-act="meh">Meh, whatever.</button>
          <button class="opt" type="button" data-act="want">Vreau guvern!</button>
        </div>

        <p class="result" id="step-meh" hidden>Sa fii sanatos!</p>

        <div id="step-parties" hidden>
          <div class="pills" id="party-pills"></div>
          <p class="tally" id="tally"></p>
          <button class="opt anticipate" type="button" id="btn-anticipate" hidden>Anticipate?</button>
        </div>

        <div class="choices" id="step-confirm" hidden>
          <button class="opt" type="button" data-act="confirm-yes">Da, sa decida poporul.</button>
          <button class="opt" type="button" data-act="confirm-no">Hai, ca am glumit cu muia aia...</button>
        </div>

        <p class="result" id="step-final" hidden>🗳️ Alegeri anticipate! Sa decida poporul.</p>
      </div>
    </main>

    <footer>
      <span id="updated"></span>
      <a href="/api/status" id="api-link" title="Copy a curl command for the API">API</a>
      <a href="/mcp" id="mcp-link" title="Copy the 'claude mcp add' command">MCP</a>
      <a class="coffee" href="https://buymeacoffee.com/andreivintila" target="_blank" rel="noopener">
        ☕ Buy me a coffee
      </a>
    </footer>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      // Footer links copy a command instead of navigating (with a graceful
      // fallback to the link's href if the clipboard is unavailable).
      const toast = document.getElementById("toast");
      let toastTimer;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }
      function copyOnClick(linkId, buildCmd, fallbackPath) {
        document.getElementById(linkId).addEventListener("click", async (e) => {
          // Prevent navigation synchronously, before the async clipboard call.
          e.preventDefault();
          try {
            await navigator.clipboard.writeText(buildCmd());
            showToast("Comanda a fost copiata! ☕");
          } catch {
            window.location.href = fallbackPath;
          }
        });
      }
      copyOnClick(
        "api-link",
        () => "curl -s " + location.origin + "/api/status",
        "/api/status"
      );
      copyOnClick(
        "mcp-link",
        () => "claude mcp add --transport http avemguvern " + location.origin + "/mcp",
        "/mcp"
      );

      // ---- Interactive opinion flow ----
      // Combined Parliament (Chamber of Deputies + Senate), 2024 election.
      // Total 465 seats; absolute majority = 233.
      const PARTIES = [
        { id: "PSD", seats: 122 },
        { id: "AUR", seats: 91 },
        { id: "PNL", seats: 71 },
        { id: "USR", seats: 59 },
        { id: "SOS", seats: 40 },
        { id: "UDMR", seats: 32 },
        { id: "POT", seats: 31 },
        { id: "Minoritati", seats: 19 },
      ];
      const MAJORITY = 233;

      const interact = document.getElementById("interact");
      const prompt = document.getElementById("prompt");
      const stepOpinion = document.getElementById("step-opinion");
      const stepMeh = document.getElementById("step-meh");
      const stepParties = document.getElementById("step-parties");
      const stepConfirm = document.getElementById("step-confirm");
      const stepFinal = document.getElementById("step-final");
      const partyPills = document.getElementById("party-pills");
      const tally = document.getElementById("tally");
      const btnAnticipate = document.getElementById("btn-anticipate");
      const selected = new Set();

      // Build party pills once.
      PARTIES.forEach((p) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "party";
        b.setAttribute("aria-pressed", "false");
        b.dataset.party = p.id;
        b.innerHTML = p.id + ' <span class="seats">' + p.seats + "</span>";
        b.addEventListener("click", () => {
          if (selected.has(p.id)) selected.delete(p.id);
          else selected.add(p.id);
          b.setAttribute("aria-pressed", selected.has(p.id) ? "true" : "false");
          updateTally();
        });
        partyPills.appendChild(b);
      });

      function updateTally() {
        const sum = PARTIES.filter((p) => selected.has(p.id)).reduce(
          (n, p) => n + p.seats,
          0
        );
        const hasMajority = sum >= MAJORITY;
        tally.classList.toggle("majority", hasMajority);
        if (selected.size === 0) {
          tally.textContent = "0 / " + MAJORITY + " mandate pentru majoritate";
        } else if (hasMajority) {
          tally.textContent = sum + " / " + MAJORITY + " mandate · Majoritate! ✊";
        } else {
          tally.textContent =
            sum + " / " + MAJORITY + " mandate · mai trebuie " + (MAJORITY - sum);
        }
        // Early elections only make sense when a coalition can't reach majority.
        btnAnticipate.hidden = !(selected.size > 0 && !hasMajority);
      }

      function show(el) {
        [stepOpinion, stepMeh, stepParties, stepConfirm, stepFinal].forEach(
          (s) => (s.hidden = s !== el)
        );
      }

      interact.addEventListener("click", (e) => {
        const act = e.target.closest("[data-act]")?.dataset.act;
        if (!act) return;
        if (act === "meh") {
          prompt.hidden = true;
          show(stepMeh);
        } else if (act === "want") {
          prompt.textContent = "De care?";
          show(stepParties);
          updateTally();
        } else if (act === "confirm-yes") {
          prompt.hidden = true;
          show(stepFinal);
        } else if (act === "confirm-no") {
          prompt.textContent = "De care?";
          show(stepParties);
        }
      });

      btnAnticipate.addEventListener("click", () => {
        prompt.textContent = "Esti sigur?";
        show(stepConfirm);
      });

      // Reveal the flow only when JS is available.
      interact.hidden = false;

      fetch("/api/status")
        .then((r) => r.json())
        .then((s) => {
          document.getElementById("answer").textContent = s.answer;
          document.getElementById("subtitle").textContent = s.subtitle;
          document.title = "Avem guvern? — " + s.answer;
          if (s.updatedAt) {
            const d = new Date(s.updatedAt);
            if (!isNaN(d)) {
              document.getElementById("updated").textContent =
                "Actualizat: " + d.toLocaleDateString("ro-RO");
            }
          }
        })
        .catch(() => {
          /* keep static fallback */
        });
    </script>
  </body>
</html>
